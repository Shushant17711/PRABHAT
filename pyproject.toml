[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prabhat"
version = "0.1.0"
description = "Tracked-object extreme weather anomaly detection with runtime hallucination gates"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Team Orbit" }]
license = "MIT"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["prabhat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
